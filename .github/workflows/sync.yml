
name: Sync EADC stats

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Import Ballchasing stats
        env:
          BALLCHASING_TOKEN: ${{ secrets.BALLCHASING_TOKEN }}
        run: run: python sync.py

      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.json
          if ! git diff --cached --quiet; then
            git commit -m "Update EADC stats"
            git push
          fi
